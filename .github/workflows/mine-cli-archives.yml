name: Mine CLI archives

# Fork-only. `just release` publishes a `v<version>-mine.<stamp>` release with
# just the macOS DMG. This attaches the Linux CLI archives and SHA256SUMS to
# that release, so the desktop app's SSH environments can install the exact
# fork runtime on a Linux host (see resolveDesktopSshCliRunner).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing mine release tag, for example v0.0.45-mine.202610071200
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mine-cli-archives-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  resolve:
    name: Resolve release
    if: contains(github.event.release.tag_name || inputs.tag, '-mine.')
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Linux ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          # node-pty compiles from source on Linux, so arm64 builds on arm64.
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - name: Build server and web client
        run: vp run --filter t3 build

      - name: Build CLI single-executable
        env:
          # Keep in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build resource monitor
        run: |
          cargo build --locked --release --target "${{ matrix.rust_target }}" \
            --manifest-path native/resource-monitor/Cargo.toml
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" "$target_dir/"

      - name: Build CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.resolve.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.resolve.outputs.version }}"

      - name: Upload CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-linux-${{ matrix.arch }}
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attach to release
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # The remote installer verifies each archive against this file.
      - name: Write checksums and upload
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" t3-*.tar.gz SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
